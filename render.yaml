services:
  - type: web
    name: fake-identity-screening
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: chmod +x build.sh && bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
